            <script src="index.js" defer></script>
            <script>
              // All the selction boxes
              let selectors = {
                "blue": [...document.getElementById("blue-controls").getElementsByTagName("image-selector")],
                "yellow": [...document.getElementById("yellow-controls").getElementsByTagName("image-selector")],
                "red": [...document.getElementById("red-controls").getElementsByTagName("image-selector")],
                "green": [...document.getElementById("green-controls").getElementsByTagName("image-selector")]
              };

              // Create all selection-changed event listeners programatically
              for (const [k, v] of Object.entries(selectors)) {
                for (let selector of v.sort((a, b) => { return a.getAttribute("position") > b.getAttribute("position") } )) {
                  let table = {};
                  
                  selector.addEventListener("selection-changed", (x) => {
                    table[k] = [{ pos: parseInt(x.target.getAttribute("position")), type: parseInt(x.target.selected) }];
                    parse_bead_table(table);
                  })
                }
              }
              
              // man in the middle (hook) to set the selectors to the same exact starting positions as the talisman
              function parse_bead_table_mitm(table, clear) {

                if (clear === true) {
                    for (const [k, v] of Object.entries(selectors)) {
                        for (let selector of v.sort((a, b) => { return a.getAttribute("position") > b.getAttribute("position") } )) {
                            selector.selected = 0;
                        }
                    }
                }

                for (const [k, v] of Object.entries(table)) {
                 for (const o of v) {
                    let elem = selectors[k].find((x) => { return x.getAttribute("position") == o.pos } );
                    elem.setAttribute("selected", o.type);
                  }
                }

                parse_bead_table(table, clear);
              }
            
              parse_bead_table_mitm({
                  "blue": [{pos: 1, type:4}, {pos: 2, type:1}, {pos: 3, type:3}],
                  "green": [{pos: 1, type:4}, {pos: 4, type:2}, {pos: 5, type:5}],
                  "red": [{pos: 3, type: 3 }],
                  "yellow": [{pos: 5, type: 5}]
              });
            </script>
